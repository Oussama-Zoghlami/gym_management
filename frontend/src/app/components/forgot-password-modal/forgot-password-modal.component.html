<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Forgot Password</h2>
      <button class="close-btn" (click)="closeModal()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="modal-body">
      <p class="description">
        Enter your email address and we'll send you a link to reset your password.
      </p>

      <!-- Alert Messages -->
      <div *ngIf="message" class="alert" [class.alert-success]="isSuccess" [class.alert-error]="!isSuccess">
        <span class="material-icons">{{ isSuccess ? 'check_circle' : 'error' }}</span>
        {{ message }}
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">
            <span class="material-icons">email</span>
            Email Address
          </label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email"
            [class.error-input]="f['email'].touched && f['email'].errors">
          <span *ngIf="f['email'].touched && f['email'].errors?.['required']" class="error">
            Email is required
          </span>
          <span *ngIf="f['email'].touched && f['email'].errors?.['email']" class="error">
            Please enter a valid email address
          </span>
        </div>

        <div class="form-actions">
          <button 
            type="button" 
            class="btn btn-secondary"
            (click)="closeModal()">
            Cancel
          </button>
          <button 
            type="submit" 
            class="btn btn-primary"
            [disabled]="isLoading">
            <span *ngIf="!isLoading">
              <span class="material-icons">send</span>
              Send Reset Link
            </span>
            <span *ngIf="isLoading" class="loading-spinner"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
