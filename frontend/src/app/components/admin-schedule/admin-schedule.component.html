<section class="schedule-wrapper">
  <div class="page-container">
  <header class="header">
    <div class="actions" style="justify-content:space-between;width:100%">
      <div style="display:flex;align-items:center;gap:10px">
        <img src="/assets/safe-fitness-logo.svg" alt="Safe Fitness" style="width:28px;height:28px" />
        <strong>Safe Fitness</strong>
      </div>
      <a routerLink="/admin" class="primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px">
        <span class="material-icons">home</span>
        Dashboard
      </a>
    </div>
    <div class="actions" style="margin-top:10px;align-items:flex-end;justify-content:flex-start">
      <div class="form-group" style="display:flex;align-items:center;gap:10px">
        <label for="gymCode" style="margin:0">Gym code</label>
        <input id="gymCode" type="text" maxlength="3" [(ngModel)]="gymCode" placeholder="e.g. 123" style="width:90px;text-transform:uppercase" />
        <button class="secondary" type="button" (click)="loadByCode()">
          <span class="material-icons">search</span>
          Load
        </button>
      </div>
    </div>
    <div class="actions actions-center" style="margin-top:10px">
      <button class="secondary" (click)="addItem()">
        <span class="material-icons">add</span>
        Add slot
      </button>
      <button class="primary save" (click)="save()" [disabled]="isSaving">
        <span class="material-icons">save</span>
        {{ isSaving ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </header>

  <form [formGroup]="form" class="list">
    <div class="item" *ngFor="let it of itemGroups; let i = index" [formGroup]="it">
      <select formControlName="dayOfWeek">
        <option value="" disabled>Select day</option>
        <option *ngFor="let d of days" [value]="d">{{ d }}</option>
      </select>
      <input type="time" formControlName="openTime" />
      <input type="time" formControlName="closeTime" />
      <input type="text" formControlName="note" placeholder="Note (optional)" />
      <button type="button" class="danger" (click)="delete(i)">
        <span class="material-icons">delete</span>
      </button>
    </div>
  </form>
  </div>
</section>
