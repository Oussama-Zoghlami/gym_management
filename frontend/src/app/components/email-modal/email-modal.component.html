<div class="modal-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-icon">
        <span class="material-icons">email</span>
      </div>
      <h2>Send Email to Member</h2>
      <button class="close-btn" (click)="onClose()">
        <span class="material-icons">close</span>
      </button>
    </div>
    
    <div class="modal-body" *ngIf="member">
      <div class="member-info">
        <div class="member-avatar">
          <span>{{ getMemberInitials(member) }}</span>
        </div>
        <div class="member-details">
          <h3>{{ member.firstname }} {{ member.lastname }}</h3>
          <p class="email">{{ member.email }}</p>
        </div>
      </div>
      
      <div class="email-form">
        <div class="form-group">
          <label for="emailContent">Message:</label>
          <textarea
            id="emailContent"
            [(ngModel)]="emailContent"
            placeholder="Type your message here..."
            rows="6"
            (keypress)="onKeyPress($event)"
            [disabled]="isSending"
          ></textarea>
        </div>
      </div>
    </div>
    
    <div class="modal-footer">
      <button 
        class="btn-send" 
        (click)="onSendEmail()" 
        [disabled]="!emailContent.trim() || isSending"
      >
        <span class="material-icons" *ngIf="!isSending">send</span>
        <span class="material-icons" *ngIf="isSending">hourglass_empty</span>
        {{ isSending ? 'Sending...' : 'Send Email' }}
      </button>
      <button class="btn-cancel" (click)="onClose()" [disabled]="isSending">
        <span class="material-icons">close</span>
        Cancel
      </button>
    </div>
  </div>
</div>
