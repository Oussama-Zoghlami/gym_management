<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48c9b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#mainGradient)" opacity="0.1"/>
  
  <!-- Shield Shape (Safety) -->
  <g transform="translate(100, 100)">
    <!-- Shield -->
    <path d="M 0 -70 
             C -40 -70, -50 -40, -50 -20
             L -50 20
             C -50 50, -30 70, 0 80
             C 30 70, 50 50, 50 20
             L 50 -20
             C 50 -40, 40 -70, 0 -70 Z" 
          fill="url(#shieldGradient)" 
          opacity="0.9"/>
    
    <!-- Dumbbell inside shield -->
    <g transform="scale(0.6)">
      <!-- Left weight plates -->
      <rect x="-70" y="-25" width="15" height="50" rx="3" fill="white"/>
      <rect x="-80" y="-20" width="8" height="40" rx="2" fill="white"/>
      <rect x="-60" y="-20" width="8" height="40" rx="2" fill="white"/>
      
      <!-- Bar -->
      <rect x="-55" y="-5" width="110" height="10" rx="5" fill="white"/>
      
      <!-- Right weight plates -->
      <rect x="55" y="-25" width="15" height="50" rx="3" fill="white"/>
      <rect x="72" y="-20" width="8" height="40" rx="2" fill="white"/>
      <rect x="52" y="-20" width="8" height="40" rx="2" fill="white"/>
    </g>
    
    <!-- Checkmark (Safety) -->
    <path d="M -20 5 L -5 20 L 25 -10" 
          stroke="white" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"
          opacity="0.9"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="3" fill="url(#mainGradient)" opacity="0.4"/>
  <circle cx="170" cy="40" r="4" fill="url(#mainGradient)" opacity="0.3"/>
  <circle cx="160" cy="160" r="3" fill="url(#mainGradient)" opacity="0.4"/>
  <circle cx="40" cy="170" r="4" fill="url(#mainGradient)" opacity="0.3"/>
</svg>
